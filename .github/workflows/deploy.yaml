name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout main Astro repo
      - name: Checkout main repository
        uses: actions/checkout@v5

      # 2️⃣ Remove local debug collection
      - name: Remove local debug people collection
        run: rm -rf src/collection_people

      # 3️⃣ Clone marc_people into the correct location
      - name: Clone marc_people repository
        uses: actions/checkout@v5
        with:
          repository: your-org/marc_people
          path: src/collection_people
          fetch-depth: 1
          # If marc_people is private:
          # token: ${{ secrets.MARC_PEOPLE_READ_TOKEN }}

      # 4️⃣ Install, build, and upload
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        # with:
        #   node-version: 22
        #   package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
